<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Pizza Hut</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/brand/logo_ph.png') }}">
    
    <!-- Bootstrap Local -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    
    <!-- Estilos Base de Seguridad (Fuentes y Logo) -->
    <!-- Este archivo se llamaba auth_base.css pero nunca existio: el 404 hacia
         que Inter y Agbalumo, que usa register.css, no se cargaran. Apunta a
         auth.css, que si existe y tiene las @font-face. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/security/auth.css') }}?v=1.0">
    
    <!-- Bloque para que cada uno inserte su propio CSS (Login, Registro, etc.) -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="auth-wrapper">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
