<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignación de Sedes al Personal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/logistics/user_list.css') }}">
</head>
<body>

    <div class="main-content">
        <div class="header-section">
            <i class="fas fa-id-card-alt header-icon"></i>
            <div>
                <h1 class="header-title">Asignación de Sedes</h1>
                <p class="header-subtitle">Control y asignación de sedes a nivel nacional</p>
            </div>
        </div>

        <div class="user-assignment-container">
            <div id="error-container" class="alert alert-danger" style="display: none;"></div>

            <div class="search-wrapper mb-4 d-flex gap-3">
                <div class="input-group search-group flex-grow-1">
                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                    <input type="text" id="searchInput" class="form-control" placeholder="Filtrar por nombre, email, rol o sede...">
                </div>
                <select id="statusFilter" class="form-select w-auto" style="border-radius: 8px; border: 1px solid #e2e8f0; color: #64748b; font-weight: 500;">
                    <option value="todos">Todos los estatus</option>
                    <option value="asignada">Sede Asignada</option>
                    <option value="sin_asignar">Sin Asignar</option>
                </select>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle assignment-table">
                    <thead>
                        <tr>
                            <th style="width: 25%;">Nombre</th>
                            <th style="width: 30%;">Email</th>
                            <th style="width: 15%;">Rol Actual</th>
                            <th style="width: 30%;">Sede Asignada</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr>
                            <td colspan="4" class="text-center text-muted py-5">Cargando personal...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/logistics/user_list.js') }}"></script>
</body>
</html>
