<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Compra | Sistema Gestion PH</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/brand/logo_ph.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inventory/inventory.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/logistics/purchase.css') }}">
</head>
<body>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 header-container">
        <div class="d-flex align-items-center">
            <div class="bg-mariuska-red text-white p-3 me-3 d-flex align-items-center justify-content-center brand-icon-box" style="width: 60px; height: 60px;">
                <i class="bi bi-cart-fill fs-2"></i>
            </div>
            <div>
                <h2 class="m-0 fw-bold system-title" style="color: #212529;">Registro de Compras</h2>
                <small class="text-muted fw-medium subtitle-text">Registrar Nueva Compra e incorporación de stock al inventario nacional</small>
            </div>
        </div>
        <a href="{{ url_for('inventory.list_products') }}" class="btn btn-filter-dark fw-bold px-4 py-2 d-flex align-items-center gap-2">
            <i class="bi bi-arrow-left"></i> Volver al Stock
        </a>
    </div>

    <form id="purchaseForm">
        <div class="row g-4 align-items-start">
            
            <div class="col-lg-8">
                <div id="productsCard" class="card border-0 rounded-4 shadow-sm bg-white overflow-hidden filter-card d-flex flex-column">
                    
                    <div class="p-4 bg-white border-bottom">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-box-seam me-2 fs-4" style="color: #B31F24;"></i>
                            <h5 class="m-0 fw-bold text-dark">Productos de la Compra</h5>
                        </div>
                    </div>

                    <div class="table-responsive flex-grow-1 px-4 mt-3">
                        <table class="table align-middle m-0 custom-insumos-table" id="itemsTable">
                            <thead>
                                <tr>
                                    <th class="text-center text-uppercase tracking-wider" style="width: 45%;">Producto / Insumo</th>
                                    <th class="text-center text-uppercase tracking-wider" style="width: 20%;">Cantidad</th>
                                    <th class="text-center text-uppercase tracking-wider" style="width: 25%;">Precio Extranjero</th>
                                    <th class="text-center text-uppercase tracking-wider" style="width: 10%;">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="itemsContainer">
                                <tr class="main-product-row">
                                    <td>
                                        <div class="table-field-wrapper">
                                            <div class="input-group mariuska-select-group">
                                                <select class="form-select border-0 py-2 bg-transparent cursor-pointer prod-id" required>
                                                    <option value="" disabled selected>-- Elige un producto --</option>
                                                    {% for p in products %}
                                                        <option value="{{ p.id }}">{{ p.name }} ({{ p.unit_of_measure }})</option>
                                                    {% endfor %}
                                                </select>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="table-field-wrapper">
                                            <div class="input-group search-input-group">
                                                <input type="number" step="0.01" class="form-control border-0 py-2 bg-transparent text-center fw-semibold prod-qty" value="10" required>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="table-field-wrapper">
                                            <div class="input-group search-input-group">
                                                <span class="input-group-text bg-transparent border-0 text-muted ps-3 pe-1"><i class="bi bi-currency-exchange"></i></span>
                                                <input type="number" step="0.01" class="form-control border-0 py-2 bg-transparent text-center fw-semibold prod-price" value="5.50" required>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="text-center">
                                        <button type="button" class="btn btn-danger btn-sm rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm" style="width: 34px; height: 34px; background-color: #dc3545; border: none;" onclick="this.closest('tr').remove()" title="Eliminar">
                                            <i class="bi bi-trash text-white fs-6"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="p-4 bg-light border-top d-flex justify-content-end align-items-center gap-3 mt-4">
                        <button type="button" class="btn btn-success fw-bold px-4 py-2.5 fs-6 shadow rounded-pill shadow-sm d-flex align-items-center gap-2" onclick="addProductRow()">
                            <i class="bi bi-plus-lg"></i> Agregar Producto
                        </button>
                        
                        <button type="submit" class="btn btn-mariuska-red fw-bold px-5 py-2.5 fs-6 shadow">
                            <i class="bi bi-check2-circle me-1"></i> Procesar y Guardar Compra
                        </button>
                    </div>

                </div>
            </div>
            
            <div class="col-lg-4">
                <div id="invoiceCard" class="card border-0 rounded-4 shadow-sm bg-white p-4 filter-card">
                    <div class="d-flex align-items-center mb-3 pb-2 border-bottom">
                        <i class="bi bi-file-earmark-text me-2 fs-4" style="color: #B31F24;"></i>
                        <h5 class="m-0 fw-bold text-dark">Datos de la Factura</h5>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Proveedor</label>
                        <div class="input-group mariuska-select-group bg-light">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3 pe-1"><i class="bi bi-building"></i></span>
                            <select id="supplier_id" class="form-select border-0 py-2 bg-transparent cursor-pointer" required>
                                <option value="" disabled selected>-- Seleccione Proveedor --</option>
                                {% for s in suppliers %}
                                    <option value="{{ s.id }}">{{ s.name }} ({{ s.tax_id }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Moneda</label>
                        <div class="input-group mariuska-select-group bg-light">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3 pe-1"><i class="bi bi-cash-coin"></i></span>
                            <select id="currency" class="form-select border-0 py-2 bg-transparent cursor-pointer">
                                <option value="USD">Dólares (USD)</option>
                                <option value="EUR">Euros (EUR)</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tasa de Cambio</label>
                        <div class="input-group search-input-group bg-light">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3"><i class="bi bi-graph-up-arrow"></i></span>
                            <input type="number" step="0.01" id="exchange_rate" class="form-control border-0 py-2 bg-transparent" value="36.55" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Usuario / Comprador</label>
                        <div class="input-group mariuska-select-group bg-light">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3 pe-1"><i class="bi bi-person-badge"></i></span>
                            <select id="user_id" class="form-select border-0 py-2 bg-transparent cursor-pointer" required>
                                <option value="" disabled selected>-- Seleccione Usuario --</option>
                                {% for u in users %}
                                    <option value="{{ u.id }}">{{ u.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">URL del Comprobante / Factura</label>
                        <div class="input-group search-input-group bg-light">
                            <span class="input-group-text bg-transparent border-0 text-muted ps-3"><i class="bi bi-link-45deg"></i></span>
                            <input type="url" id="invoice_url" class="form-control border-0 py-2 bg-transparent" value="https://i.ibb.co/factura_ejemplo.png">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </form>
</div>

<script>
    // CONTROL DE ALTURAS UNIFORMES E INDEPENDIENTES
    document.addEventListener('DOMContentLoaded', () => {
        const productsCard = document.getElementById('productsCard');
        const invoiceCard = document.getElementById('invoiceCard');
        
        if (productsCard && invoiceCard && window.innerWidth >= 992) {
            // Evaluamos cuál tarjeta es más alta al renderizar la página inicialmente
            const initialMaxHeight = Math.max(productsCard.offsetHeight, invoiceCard.offsetHeight);
            
            // La de productos usa min-height para poder expandirse libremente al añadir filas
            productsCard.style.minHeight = `${initialMaxHeight}px`;
            
            // La de facturas se congela con height fija para que nunca crezca con los productos
            invoiceCard.style.height = `${initialMaxHeight}px`;
        }
    });

    // Función dinámica para nuevas filas
    function addProductRow() {
        const tbody = document.getElementById('itemsContainer');
        const firstSelect = document.querySelector('.prod-id');
        const optionsHtml = firstSelect ? firstSelect.innerHTML : '<option value="">-- Elige un producto --</option>';

        const row = document.createElement('tr');
        row.className = 'main-product-row';
        row.innerHTML = `
            <td>
                <div class="table-field-wrapper">
                    <div class="input-group mariuska-select-group">
                        <select class="form-select border-0 py-2 bg-transparent cursor-pointer prod-id" required>
                            ${optionsHtml}
                        </select>
                    </div>
                </div>
            </td>
            <td>
                <div class="table-field-wrapper">
                    <div class="input-group search-input-group">
                        <input type="number" step="0.01" class="form-control border-0 py-2 bg-transparent text-center fw-semibold prod-qty" required>
                    </div>
                </div>
            </td>
            <td>
                <div class="table-field-wrapper">
                    <div class="input-group search-input-group">
                        <span class="input-group-text bg-transparent border-0 text-muted ps-2 pe-1"><i class="bi bi-currency-exchange"></i></span>
                        <input type="number" step="0.01" class="form-control border-0 py-2 bg-transparent text-center fw-semibold prod-price" required>
                    </div>
                </div>
            </td>
            <td class="text-center">
                <button type="button" class="btn btn-danger btn-sm rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm" style="width: 34px; height: 34px; background-color: #dc3545; border: none;" onclick="this.closest('tr').remove()" title="Eliminar">
                    <i class="bi bi-trash text-white fs-6"></i>
                </button>
            </td>
        `;
        tbody.appendChild(row);

        if (typeof TomSelect !== 'undefined') {
            new TomSelect(row.querySelector('.prod-id'), {});
        }
    }

    // Envío AJAX del formulario al backend
    document.getElementById('purchaseForm').addEventListener('submit', async (e) => {
        e.preventDefault(); 

        const payload = {
            supplier_id: parseInt(document.getElementById('supplier_id').value),
            currency: document.getElementById('currency').value,
            exchange_rate: parseFloat(document.getElementById('exchange_rate').value),
            user_id: parseInt(document.getElementById('user_id').value),
            invoice_url: document.getElementById('invoice_url').value,
            items: []
        };

        const rows = document.querySelectorAll('#itemsContainer tr.main-product-row');
        rows.forEach(row => {
            const prodIdVal = row.querySelector('.prod-id').value;
            const qtyVal = row.querySelector('.prod-qty').value;
            const priceVal = row.querySelector('.prod-price').value;

            if(prodIdVal) {
                payload.items.push({
                    product_id: parseInt(prodIdVal),
                    quantity: parseFloat(qtyVal),
                    foreign_price: parseFloat(priceVal)
                });
            }
        });

        try {
            const response = await fetch('/logistics/purchases', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                alert("¡Éxito!: " + result.message);
                document.getElementById('purchaseForm').reset();
                const container = document.getElementById('itemsContainer');
                container.innerHTML = '';
                addProductRow();
            } else {
                alert("Error: " + (result.error || result.message));
            }
        } catch (error) {
            console.error("Error:", error);
            alert("No se pudo conectar con el servidor backend.");
        }
    });
</script>

</body>
</html>
