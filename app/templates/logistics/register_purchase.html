<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PH - Registro de Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">Módulo de Logística: Registrar Nueva Compra</h3>
        </div>
        <div class="card-body">
            <form id="purchaseForm">
                <h5 class="text-secondary border-bottom pb-2">Datos de la Factura</h5>
                <div class="row mb-4">
                    <div class="col-md-3">
                        <label class="form-label">ID Proveedor</label>
                        <input type="number" id="supplier_id" class="form-control" value="1" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Moneda</label>
                        <select id="currency" class="form-select">
                            <option value="USD">Dólares (USD)</option>
                            <option value="EUR">Euros (EUR)</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Tasa de Cambio</label>
                        <input type="number" step="0.01" id="exchange_rate" class="form-control" value="36.55" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ID Usuario (Tú)</label>
                        <input type="number" id="user_id" class="form-control" value="1" required>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-12">
                        <label class="form-label">URL de la Factura (Simulada por ahora)</label>
                        <input type="url" id="invoice_url" class="form-control" value="https://i.ibb.co/factura_ejemplo.png">
                    </div>
                </div>

                <h5 class="text-secondary border-bottom pb-2 d-flex justify-content-between align-items-center">
                    Productos de la Compra
                    <button type="button" class="btn btn-sm btn-success" onclick="addProductRow()">+ Agregar Producto</button>
                </h5>

                <table class="table table-bordered" id="itemsTable">
                    <thead class="table-dark">
                        <tr>
                            <th>ID Producto</th>
                            <th>Cantidad</th>
                            <th>Precio Extranjero (Foreign Price)</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="itemsContainer">
                        <tr>
                            <td><input type="number" class="form-control prod-id" value="1" required></td>
                            <td><input type="number" step="0.01" class="form-control prod-qty" value="10" required></td>
                            <td><input type="number" step="0.01" class="form-control prod-price" value="5.50" required></td>
                            <td><button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()">Eliminar</button></td>
                        </tr>
                    </tbody>
                </table>

                <div class="text-end mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Procesar y Guardar Compra</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Función para añadir dinámicamente filas de productos
    function addProductRow() {
        const tbody = document.getElementById('itemsContainer');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><input type="number" class="form-control prod-id" required></td>
            <td><input type="number" step="0.01" class="form-control prod-qty" required></td>
            <td><input type="number" step="0.01" class="form-control prod-price" required></td>
            <td><button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()">Eliminar</button></td>
        `;
        tbody.appendChild(row);
    }

    // Capturar el envío del formulario
    document.getElementById('purchaseForm').addEventListener('submit', async (e) => {
        e.preventDefault(); // Evita que la página se recargue

        // 1. Recolectar datos de la cabecera
        const payload = {
            supplier_id: parseInt(document.getElementById('supplier_id').value),
            currency: document.getElementById('currency').value,
            exchange_rate: parseFloat(document.getElementById('exchange_rate').value),
            user_id: parseInt(document.getElementById('user_id').value),
            invoice_url: document.getElementById('invoice_url').value,
            items: []
        };

        // 2. Recolectar todos los productos añadidos en la tabla
        const rows = document.querySelectorAll('#itemsContainer tr');
        rows.forEach(row => {
            payload.items.push({
                product_id: parseInt(row.querySelector('.prod-id').value),
                quantity: parseFloat(row.querySelector('.prod-qty').value),
                foreign_price: parseFloat(row.querySelector('.prod-price').value)
            });
        });

        // 3. Enviar los datos mediante POST usando Fetch
        try {
            const response = await fetch('/logistics/purchases', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                alert("¡Éxito!: " + result.message + " (ID Compra: " + result.purchase_id + ")");
                // Opcional: limpiar formulario o redireccionar
            } else {
                alert("Error en validación: " + (result.error || result.message));
            }
        } catch (error) {
            console.error("Error en la petición:", error);
            alert("No se pudo conectar con el servidor backend.");
        }
    });
</script>

</body>
</html>
