<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/logistics/supplier.css') }}">
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2><i class="bi bi-truck"></i> Registrar Proveedor</h2>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        <form action="{{ url_for('logistics.suppliers.handle_register') }}" method="POST" class="supplier-form" id="supplierForm">
            
            <div class="form-group">
                <label for="name">Razón Social / Nombre</label>
                <input type="text" id="name" name="name" maxlength="150" required placeholder="Ej. Distribuidora Alimentos C.A.">
            </div>

            <div class="form-group">
                <label for="tax_id">RIF / Tax ID</label>
                <input type="text" id="tax_id" name="tax_id" maxlength="20" required placeholder="Ej. J-12345678-9">
            </div>

            <div class="form-group">
                <label for="contact_name">Persona de Contacto</label>
                <input type="text" id="contact_name" name="contact_name" maxlength="100" required placeholder="Ej. María Pérez">
            </div>

            <div class="form-group">
                <label for="phone">Teléfono</label>
                <input type="tel" id="phone" name="phone" maxlength="20" required placeholder="Ej. +58 412-0000000" oninput="this.value = this.value.replace(/[^0-9+\-\s]/g, '')">
                <small id="phone-error" class="validation-msg"></small>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" maxlength="100" required placeholder="ejemplo@correo.com">
                <small id="email-error" class="validation-msg"></small>
            </div>

            <div class="form-group">
                <label for="status">Estado inicial</label>
                <select id="status" name="status">
                    <option value="Active" selected>Activo</option>
                    <option value="Inactive">Inactivo</option>
                </select>
            </div>

            <div class="form-actions">
                <a href="#" class="btn-cancel">Cancelar</a>
                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="bi-save"></span> Guardar Proveedor
                </button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const phoneInput = document.getElementById('phone');
            const phoneError = document.getElementById('phone-error');
            const emailInput = document.getElementById('email');
            const emailError = document.getElementById('email-error');
            const submitBtn = document.getElementById('submitBtn');

            const phoneRegex = /^\+?[0-9][0-9\-\s]{7,18}[0-9]$/;
            const emailRegex = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

            function validateForm() {
                let isPhoneValid = phoneRegex.test(phoneInput.value);
                let isEmailValid = emailRegex.test(emailInput.value);
                
                submitBtn.disabled = (!isPhoneValid && phoneInput.value !== '') || (!isEmailValid && emailInput.value !== '');
            }

            phoneInput.addEventListener('input', function() {
                if (this.value.length === 0) {
                    phoneError.textContent = '';
                } else if (!phoneRegex.test(this.value)) {
                    phoneError.textContent = 'Formato inválido. Ej: +58 412-0000000';
                    phoneError.className = 'validation-msg text-danger';
                } else {
                    phoneError.textContent = 'Formato válido';
                    phoneError.className = 'validation-msg text-success';
                }
                validateForm();
            });

            emailInput.addEventListener('input', function() {
                if (this.value.length === 0) {
                    emailError.textContent = '';
                } else if (!emailRegex.test(this.value)) {
                    emailError.textContent = 'Debe incluir "@" y un dominio válido';
                    emailError.className = 'validation-msg text-danger';
                } else {
                    emailError.textContent = 'Correo válido';
                    emailError.className = 'validation-msg text-success';
                }
                validateForm();
            });
        });
    </script>
</body>
</html>
