{% macro render_venezuela_states(selected_value='') %}
<select name="state" id="state" class="form-select" required>
    <option value="" {% if selected_value == '' %}selected{% endif %}>Seleccione un Estado...</option>
    
    {% set states = [
        'Amazonas', 'Anzoátegui', 'Apure', 'Aragua', 'Barinas', 'Bolívar', 
        'Carabobo', 'Cojedes', 'Delta Amacuro', 'Distrito Capital', 'Falcón', 
        'Guárico', 'Lara', 'Mérida', 'Miranda', 'Monagas', 'Nueva Esparta', 
        'Portuguesa', 'Sucre', 'Táchira', 'Trujillo', 'Vargas', 'Yaracuy', 'Zulia'
    ] %}

    {% for state in states %}
        <option value="{{ state }}" {% if selected_value == state %}selected{% endif %}>
            {% if state == 'Vargas' %}Vargas (La Guaira){% else %}{{ state }}{% endif %}
        </option>
    {% endfor %}
</select>
{% endmacro %}
