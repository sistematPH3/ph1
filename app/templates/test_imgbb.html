<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subida de Factura</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 500px; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        .btn-submit { background-color: #007bff; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .btn-cancel { background-color: red; color: white; padding: 10px 15px; border: none; text-decoration: none; border-radius: 3px; display: inline-block; font-weight: bold; }
        .error { color: red; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Prueba del Módulo 4</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="error">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        
        <form action="{{ url_for('imgbb.process_upload') }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="invoice_photo">Evidencia fotográfica:</label><br><br>
                <input type="file" name="invoice_photo" id="invoice_photo" accept="image/*" required>
            </div>
            <div class="form-group">
                <button type="submit" class="btn-submit">Subir a la Nube</button>
                <a href="#" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
